<!DOCTYPE html>
<html lang="it">
<head>
  <base href="/edilapp/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EdilApp - gestione dipendenti in cantiere: ore, foto e attivita'.">

  <!-- Adatta la pagina allo schermo del telefono, notch compreso -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Installazione sulla schermata Home di iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EdilApp">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <meta name="theme-color" content="#1F3864">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <title>EdilApp</title>

  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background-color: #1F3864;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }
    /* Schermata di avvio mostrata finche' l'app non e' pronta */
    #avvio {
      position: fixed; inset: 0; z-index: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1F3864;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #F2A007;
    }
    #avvio img { width: 96px; height: 96px; border-radius: 22px; }
    #avvio .nome { margin-top: 18px; font-size: 22px; font-weight: 700; letter-spacing: .5px; }
    #avvio .barra {
      margin-top: 26px; width: 140px; height: 4px; border-radius: 2px;
      background: rgba(242,160,7,.25); overflow: hidden;
    }
    #avvio .barra span {
      display: block; height: 100%; width: 40%; border-radius: 2px;
      background: #F2A007; animation: scorri 1.1s ease-in-out infinite;
    }
    @keyframes scorri {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }

    /* Barra "Installa app": compare da sola quando il telefono puo' installarla */
    #installa {
      position: fixed;
      left: 12px; right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 2147483000;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 12px 12px 14px;
      background: #1F3864; color: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, .34);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      transform: translateY(160%); opacity: 0;
      transition: transform .28s ease, opacity .28s ease;
    }
    #installa[hidden] { display: none; }
    #installa.visibile { transform: none; opacity: 1; }
    #installa img {
      width: 42px; height: 42px; border-radius: 11px; flex: none;
      background: rgba(255, 255, 255, .13);
    }
    #installa .testo {
      display: flex; flex-direction: column; line-height: 1.32; min-width: 0; flex: 1;
    }
    #installa .testo strong { font-size: 15px; font-weight: 700; }
    #installa .testo span { font-size: 12.5px; color: rgba(255, 255, 255, .78); }
    #installa .testo span.istruzioni { font-size: 13.5px; color: rgba(255, 255, 255, .95); }
    #installa .testo span.istruzioni svg {
      width: 13px; height: 15px; vertical-align: -2px; margin: 0 3px;
    }
    #installa button { border: 0; cursor: pointer; font-family: inherit; flex: none; }
    #installa-si {
      background: #F2A007; color: #1F3864;
      font-size: 15px; font-weight: 700;
      padding: 11px 17px; border-radius: 11px;
    }
    #installa-si:active { background: #C97F00; }
    #installa-no {
      background: transparent; color: rgba(255, 255, 255, .65);
      font-size: 23px; line-height: 1; padding: 4px 6px;
    }
    @media (max-width: 400px) {
      #installa .testo span:not(.istruzioni) { display: none; }
    }
  </style>
</head>
<body>
  <div id="avvio">
    <img src="icons/Icon-192.png" alt="EdilApp">
    <div class="nome">EdilApp</div>
    <div class="barra"><span></span></div>
  </div>

  <div id="installa" hidden>
    <img src="icons/Icon-192.png" alt="">
    <div class="testo">
      <strong>Installa EdilApp</strong>
      <span id="installa-dettaglio">Si apre a schermo intero, come una vera app.</span>
    </div>
    <button id="installa-si" type="button">Installa</button>
    <button id="installa-no" type="button" aria-label="Non ora">&times;</button>
  </div>

  <script src="prova/flutter_bootstrap.js" async></script>

  <script>
    // Registra il nostro service worker: e' quello che fa partire l'app
    // in un lampo dalla seconda volta, la fa aprire anche senza rete e
    // permette al telefono di proporre "Installa app".
    // In sviluppo (localhost) lo saltiamo, altrimenti la cache nasconde
    // le modifiche appena fatte.
    (function () {
      var locale = ['localhost', '127.0.0.1', '::1'].indexOf(location.hostname) >= 0;
      if (!('serviceWorker' in navigator) || locale) return;
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (errore) {
          console.warn('Service worker non registrato:', errore);
        });
      });
    })();
  </script>

  <script>
    // Toglie la schermata di avvio appena Flutter ha disegnato l'interfaccia.
    (function () {
      var avvio = document.getElementById('avvio');
      if (!avvio) return;
      function pronto() {
        return document.querySelector('flutter-view, flt-glass-pane, flt-scene-host');
      }
      function nascondi() {
        avvio.style.transition = 'opacity .25s ease';
        avvio.style.opacity = '0';
        setTimeout(function () { avvio.remove(); }, 300);
      }
      var osservatore = new MutationObserver(function () {
        if (pronto()) { osservatore.disconnect(); nascondi(); }
      });
      osservatore.observe(document.body, { childList: true, subtree: true });
      // Sicurezza: dopo 12 secondi la togliamo comunque.
      setTimeout(function () { if (document.getElementById('avvio')) nascondi(); }, 12000);
    })();
  </script>

  <script>
    // Propone di installare l'app sulla schermata Home.
    // Su Chrome e Edge il browser ci avvisa quando e' possibile; su Safari
    // (iPhone) non esiste un modo automatico, quindi mostriamo le istruzioni.
    (function () {
      var CHIAVE = 'edilapp_installa_rimandato';
      var GIORNI = 7 * 24 * 60 * 60 * 1000;

      var barra = document.getElementById('installa');
      var siPuo = document.getElementById('installa-si');
      var noGrazie = document.getElementById('installa-no');
      var dettaglio = document.getElementById('installa-dettaglio');
      var richiesta = null;

      function giaInstallata() {
        try {
          return window.matchMedia('(display-mode: standalone)').matches ||
                 window.matchMedia('(display-mode: fullscreen)').matches ||
                 window.navigator.standalone === true;
        } catch (e) { return false; }
      }

      function rimandata() {
        try {
          var quando = localStorage.getItem(CHIAVE);
          return !!quando && (Date.now() - parseInt(quando, 10)) < GIORNI;
        } catch (e) { return false; }
      }

      function rimanda() {
        try { localStorage.setItem(CHIAVE, String(Date.now())); } catch (e) {}
      }

      function mostra() {
        if (!barra || giaInstallata() || rimandata()) return;
        barra.hidden = false;
        requestAnimationFrame(function () { barra.classList.add('visibile'); });
      }

      function nascondi() {
        if (!barra) return;
        barra.classList.remove('visibile');
        setTimeout(function () { barra.hidden = true; }, 300);
      }

      window.addEventListener('beforeinstallprompt', function (evento) {
        evento.preventDefault();       // niente barretta grigia di Chrome
        richiesta = evento;
        setTimeout(mostra, 2500);      // lasciamo prima comparire l'app
      });

      window.addEventListener('appinstalled', function () {
        richiesta = null;
        try { localStorage.removeItem(CHIAVE); } catch (e) {}
        nascondi();
      });

      if (siPuo) {
        siPuo.addEventListener('click', function () {
          if (!richiesta) { nascondi(); return; }
          richiesta.prompt();
          richiesta.userChoice.then(function (scelta) {
            if (!scelta || scelta.outcome !== 'accepted') rimanda();
            richiesta = null;
            nascondi();
          }).catch(function () { nascondi(); });
        });
      }

      if (noGrazie) {
        noGrazie.addEventListener('click', function () { rimanda(); nascondi(); });
      }

      // iPhone e iPad: Safari non emette beforeinstallprompt.
      var suApple = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      var altroBrowser = /CriOS|FxiOS|EdgiOS|OPiOS/.test(navigator.userAgent);
      if (suApple && !altroBrowser && !giaInstallata()) {
        if (siPuo) siPuo.hidden = true;
        if (dettaglio) {
          dettaglio.className = 'istruzioni';
          dettaglio.innerHTML =
            'Tocca Condividi' +
            '<svg viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="2.1" ' +
            'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
            '<path d="M12 19V3m0 0-5 5m5-5 5 5"/><path d="M6 11H3v14h18V11h-3"/></svg>' +
            'in basso, poi &laquo;Aggiungi a Home&raquo;.';
        }
        setTimeout(mostra, 3000);
      }
    })();
  </script>
</body>
</html>
